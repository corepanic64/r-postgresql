[package]
name = "rust_postgres_app"
version = "0.1.0"
edition = "2024"

[dependencies]

tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "runtime-tokio-rustls"] }
dotenv = "0.15"
axum = { version = "0.8.9", features = ["macros"] }
serde_json = "1.0.151"
serde = "1.0.229"
bcrypt = "0.19.3"
# jsonwebtoken = "11.0.0"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
chrono = "0.4.45"
